version: '3.9'

services:
  claimit:
    build: .
    container_name: claimit_app
    restart: unless-stopped
    ports:
      - "${PORT:-8847}:8847"
    environment:
      - PORT=8847
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM=${SENDGRID_FROM:-no-reply@claimit.local}
    volumes:
      # Persist the SQLite database outside the container
      - claimit_data:/app/database.db
      # Persist uploaded evidence files
      - claimit_evidence:/app/storage/evidence

volumes:
  claimit_data:
  claimit_evidence:
