version: '3.9'

services:
  claimit:
    build: .
    container_name: claimit_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM=${SENDGRID_FROM:-no-reply@claimit.local}
    volumes:
      # Persist the SQLite database outside the container
      - claimit_data:/app/database.db

volumes:
  claimit_data:
