version: '3.9'

services:
  claimit:
    build: .
    container_name: claimit_app
    restart: unless-stopped
    ports:
      - "${PORT:-8847}:8847"
    environment:
      - PORT=8847
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/app/data/database.db
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-no-reply@claimit.local}
    volumes:
      # Persist the SQLite database directory (WAL + shm journals preserved)
      - claimit_data:/app/data
      # Persist uploaded evidence files
      - claimit_evidence:/app/storage/evidence

volumes:
  claimit_data:
  claimit_evidence:
